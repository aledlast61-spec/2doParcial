<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="favicon3.ico">
    <link rel="stylesheet" href="estilo.css">

    <title>Progresión 6</title>
</head>
<body>
    <h3 id="etiqueta"></h3>
    <h1 id="titulo"></h1>
    <hr>

    <h2 id="subtitulo1"></h2>
    <p id="parrafo1"></p>
    <ul>
        <li id="lugar1"></li>
        <li id="lugar2"></li>
        <li id="lugar3"></li>
        <li id="lugar4"></li>
    </ul>
    <p id="parrafo2"></p>

    <h3 id="subtitulo2"></h3>
    <ul>
        <li id="estado1"></li>
    </ul>
    <p id="parrafo3"></p>

    <h2 id="subtitulo3"></h2>
    <p id="parrafo4"></p>
    <ul>
        <li id="idea1"></li>
        <li id="idea2"></li>
    </ul>
    <p id="parrafo5"></p>
    <p id="parrafo6"></p>
    <ul>
        <li id="venta1"></li>
        <li id="venta2"></li>
    </ul>
    <p id="parrafo7"></p>

    <h3 id="subtitulo4"></h3>
    <ul>
        <li id="consecuencia1"></li>
        <li id="consecuencia2"></li>
        <li id="consecuencia3"></li>
    </ul>

    <hr>
    <a href="indice.html">Volver al inicio</a>

    <script>
        let elemento;

        elemento = document.getElementById("etiqueta");
        elemento.innerHTML = "Progresión 6";

        elemento = document.getElementById("titulo");
        elemento.innerHTML = "La desamortización de tierras comunales en México del siglo XIX";

        elemento = document.getElementById("subtitulo1");
        elemento.innerHTML = "La tierra y su comunidad";

        elemento = document.getElementById("parrafo1");
        elemento.innerHTML = "Para muchos pueblos indígenas la tierra no era solo un espacio para trabajar sino:";

        elemento = document.getElementById("lugar1");
        elemento.innerHTML = "Lugar donde vivían sus familias.";

        elemento = document.getElementById("lugar2");
        elemento.innerHTML = "Cultivaban sus alimentos.";

        elemento = document.getElementById("lugar3");
        elemento.innerHTML = "Realizaban ceremonias.";

        elemento = document.getElementById("lugar4");
        elemento.innerHTML = "Conservaban sus tradiciones.";

        elemento = document.getElementById("parrafo2");
        elemento.innerHTML = "La tierra pertenecía a toda la comunidad, y se organizaban para cuidarla y aprovecharla de manera conjunta.";

        elemento = document.getElementById("subtitulo2");
        elemento.innerHTML = "En el siglo XIX:";

        elemento = document.getElementById("estado1");
        elemento.innerHTML = "El estado mexicano impulsó leyes inspiradas en ideas liberales que buscaban transformar las tierras comunales en propiedades privadas.";

        elemento = document.getElementById("parrafo3");
        elemento.innerHTML = "Esto afectó a las comunidades que se vieron obligadas a trabajar para otras personas o a emigrar.";

        elemento = document.getElementById("subtitulo3");
        elemento.innerHTML = "Las ideas liberales y la posesión de la tierra";

        elemento = document.getElementById("parrafo4");
        elemento.innerHTML = "En el siglo XIX, las ideas liberales promovían que el progreso del país dependía de:";

        elemento = document.getElementById("idea1");
        elemento.innerHTML = "La propiedad privada.";

        elemento = document.getElementById("idea2");
        elemento.innerHTML = "Libre comercio.";

        elemento = document.getElementById("parrafo5");
        elemento.innerHTML = "Para los liberales, las tierras comunales \"no producían lo suficiente\" ya que no se utilizaban técnicas modernas.";

        elemento = document.getElementById("parrafo6");
        elemento.innerHTML = "El gobierno estableció leyes como las de desamortización (1856 – 1861), que permitieron vender tierras de:";

        elemento = document.getElementById("venta1");
        elemento.innerHTML = "Comunidades indígenas.";

        elemento = document.getElementById("venta2");
        elemento.innerHTML = "La iglesia y los pueblos.";

        elemento = document.getElementById("parrafo7");
        elemento.innerHTML = "La intención era crear propiedades privadas y atraer inversiones.";

        elemento = document.getElementById("subtitulo4");
        elemento.innerHTML = "Lamentablemente...";

        elemento = document.getElementById("consecuencia1");
        elemento.innerHTML = "Estas leyes beneficiaron a personas con dinero e influencia.";

        elemento = document.getElementById("consecuencia2");
        elemento.innerHTML = "Muchas comunidades perdieron sus tierras sin comprender bien los procesos legales.";

        elemento = document.getElementById("consecuencia3");
        elemento.innerHTML = "Se generó desigualdad y conflictos.";
    </script>
    <script>
        alert("¡Dato técnico!\n\nEsta página fue hecha utilizando JavaScript, mediante getElementById() e innerHTML.");
    </script>
    
</body>
</html>
